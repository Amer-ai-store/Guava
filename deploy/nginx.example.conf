# Template only: not deployed. Replace the DNS name and use a trusted WEBSITE certificate.
# Place limit zones in the http{} context. Never use the uploaded administrator PFX blindly.
limit_req_zone $binary_remote_addr zone=trustsoft_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=trustsoft_connections:10m;
server {
    listen 443 ssl;
    server_name REPLACE_WITH_REAL_DASHBOARD_HOST;
    ssl_certificate /etc/trustsoft/tls/site-chain.pem;
    ssl_certificate_key /etc/trustsoft/tls/site-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 9m;
    limit_req zone=trustsoft_requests burst=20 nodelay;
    limit_conn trustsoft_connections 20;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
